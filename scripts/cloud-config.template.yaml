#cloud-config

write_files:
# setup script
  - path: "/root/setup.preflight.sh"
    permissions: "0777"
    encoding: "gzip+base64"
    content: |
      ${setup_preflight_sh_content}
  - path: "/root/setup.sh"
    permissions: "0777"
    encoding: "gzip+base64"
    content: |
      ${setup_template_sh_content}
  - path: "/root/deploy.sh"
    permissions: "0777"
    encoding: "gzip+base64"
    content: |
      ${deploy_template_content}
  - path: "/root/catalogue.sql"
    permissions: "0777"
    encoding: "gzip+base64"
    content: |
      ${catalogue_sql_template_content}
  - path: "/root/docker-compose.yml"
    permissions: "0777"
    encoding: "gzip+base64"
    content: |
      ${docker_compose_yml_content}
  - path: "/root/traefik_dynamic_conf.toml"
    permissions: "0644"
    content: |
      # Dynamic configuration for Traefik

      [http.middlewares]
        [http.middlewares.secure-headers.headers]
          browserXssFilter = true
          contentTypeNosniff = true
          frameDeny = true
          sslRedirect = true
          hostsProxyHeaders = ["X-Forwarded-Host"]
          stsIncludeSubdomains = true
          stsPreload = true
          stsSeconds = 31536000
          customFrameOptionsValue = "SAMEORIGIN"
          contentSecurityPolicy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; font-src 'self' data:; object-src 'none'; media-src 'self'; frame-src 'self'; worker-src 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content"

        [http.middlewares.compress.compress]
          excludedContentTypes = ["text/event-stream"]

        [http.middlewares.rate-limit.rateLimit]
          average = 100
          burst = 50

      [tls.options]
        [tls.options.default]
          minVersion = "VersionTLS12"
          sniStrict = true
          cipherSuites = [
            "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
            "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
            "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
            "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
            "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305",
            "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
          ]
  - path: "/root/check_swarm_status.sh"
    permissions: "0755"
    content: |
      #!/bin/bash
      # Script to check the status of Docker Swarm services

      # No colors in output for cloud-init compatibility

      echo "Checking Docker Swarm status..."

      # Check if Docker is running
      if ! systemctl is-active --quiet docker; then
          echo "Docker is not running!"
          echo "Attempting to start Docker..."
          sudo systemctl start docker
          sleep 5
          if ! systemctl is-active --quiet docker; then
              echo "Failed to start Docker. Please check the Docker service."
              exit 1
          fi
      fi

      # Check if node is part of a swarm
      if ! docker info | grep -q "Swarm: active"; then
          echo "This node is not part of an active swarm!"
          exit 1
      fi

      # Check swarm node status
      echo "\nSwarm Nodes:"
      docker node ls

      # Check swarm services
      echo "\nSwarm Services:"
      docker service ls

      # Check for services with 0 replicas running
      zero_replicas=$(docker service ls --format "{{.Name}} {{.Replicas}}" | grep "/0" || true)
      if [ -n "$zero_replicas" ]; then
          echo "\nServices with 0 replicas running:"
          echo "$zero_replicas"
      fi

      # Check network status
      echo "\nNetwork Status:"
      docker network ls | grep -E 'lb_network|agent_network'

      # Check for any service logs with errors
      echo "\nChecking for service errors..."
      for service in $(docker service ls --format "{{.Name}}"); do
          # Get the container IDs for this service
          containers=$(docker ps -q --filter "name=$service")
          if [ -n "$containers" ]; then
              for container in $containers; do
                  # Check for errors in the logs (last 50 lines)
                  errors=$(docker logs --tail 50 $container 2>&1 | grep -i "error\|exception\|fatal" || true)
                  if [ -n "$errors" ]; then
                      echo "Errors found in $service:"
                      echo "$errors" | head -5
                      echo "Use 'docker logs $container' for full logs"
                  fi
              done
          fi
      done

      # Check Traefik status specifically
      echo "\nChecking Traefik status..."
      traefik_container=$(docker ps -q --filter "name=swarm_traefik")
      if [ -n "$traefik_container" ]; then
          echo "Traefik is running (Container ID: $traefik_container)"

          # Check if Traefik is serving the dashboard
          if docker exec $traefik_container wget -q -O- http://localhost:8080/api/rawdata 2>/dev/null | grep -q "routers"; then
              echo "Traefik API is responding correctly"
          else
              echo "Traefik API is not responding correctly"
          fi

          # Check for certificate issues
          cert_issues=$(docker logs $traefik_container 2>&1 | grep -i "certificate\|tls\|acme" | grep -i "error\|fail\|invalid" || true)
          if [ -n "$cert_issues" ]; then
              echo "Certificate issues detected:"
              echo "$cert_issues" | head -5
          fi
      else
          echo "Traefik is not running!"
      fi

      # Check Registry status
      echo "\nChecking Registry status..."
      registry_container=$(docker ps -q --filter "name=swarm_registry")
      if [ -n "$registry_container" ]; then
          echo "Registry is running (Container ID: $registry_container)"

          # Check if Registry API is responding
          if docker exec $registry_container wget -q -O- http://localhost:5000/v2/ 2>/dev/null | grep -q "{}"; then
              echo "Registry API is responding correctly"
          else
              echo "Registry API is not responding correctly"
          fi
      else
          echo "Registry is not running!"
      fi

      # Check Portainer status
      echo "\nChecking Portainer status..."
      portainer_container=$(docker ps -q --filter "name=swarm_portainer")
      if [ -n "$portainer_container" ]; then
          echo "Portainer is running (Container ID: $portainer_container)"

          # Check if Portainer API is responding
          if docker exec $portainer_container wget -q -O- http://localhost:9000/api/status 2>/dev/null | grep -q "Version"; then
              echo "Portainer API is responding correctly"
          else
              echo "Portainer API is not responding correctly"
          fi
      else
          echo "Portainer is not running!"
      fi

      echo "\nStatus check complete!"
  - path: "/root/restart_services.sh"
    permissions: "0755"
    content: |
      #!/bin/bash
      # Script to restart Docker Swarm services if they're not running properly

      # No colors in output for cloud-init compatibility

      echo "Checking and restarting services if needed..."

      # Check if Docker is running
      if ! systemctl is-active --quiet docker; then
          echo "Docker is not running!"
          echo "Attempting to start Docker..."
          sudo systemctl start docker
          sleep 5
          if ! systemctl is-active --quiet docker; then
              echo "Failed to start Docker. Please check the Docker service."
              exit 1
          fi
      fi

      # Check if node is part of a swarm
      if ! docker info | grep -q "Swarm: active"; then
          echo "This node is not part of an active swarm!"
          exit 1
      fi

      # Function to restart a service
      restart_service() {
          local service=$1
          echo "Restarting $service..."
          docker service update --force $service
          echo "$service restart initiated."
      }

      # Check for services with 0 replicas running
      zero_replicas=$(docker service ls --format "{{.Name}} {{.Replicas}}" | grep "/0" || true)
      if [ -n "$zero_replicas" ]; then
          echo "\nServices with 0 replicas running:"
          echo "$zero_replicas"

          # Extract service names and restart them
          for service in $(echo "$zero_replicas" | awk '{print $1}'); do
              restart_service $service
          done
      fi

      # Check Traefik status
      traefik_container=$(docker ps -q --filter "name=swarm_traefik")
      if [ -z "$traefik_container" ]; then
          echo "Traefik is not running!"
          restart_service swarm_traefik
      else
          # Check if Traefik is serving the dashboard
          if ! docker exec $traefik_container wget -q -O- http://localhost:8080/api/rawdata 2>/dev/null | grep -q "routers"; then
              echo "Traefik API is not responding correctly"
              restart_service swarm_traefik
          fi
      fi

      # Check Registry status
      registry_container=$(docker ps -q --filter "name=swarm_registry")
      if [ -z "$registry_container" ]; then
          echo "Registry is not running!"
          restart_service swarm_registry
      else
          # Check if Registry API is responding
          if ! docker exec $registry_container wget -q -O- http://localhost:5000/v2/ 2>/dev/null | grep -q "{}"; then
              echo "Registry API is not responding correctly"
              restart_service swarm_registry
          fi
      fi

      # Check Portainer status
      portainer_container=$(docker ps -q --filter "name=swarm_portainer")
      if [ -z "$portainer_container" ]; then
          echo "Portainer is not running!"
          restart_service swarm_portainer
      else
          # Check if Portainer API is responding
          if ! docker exec $portainer_container wget -q -O- http://localhost:9000/api/status 2>/dev/null | grep -q "Version"; then
              echo "Portainer API is not responding correctly"
              restart_service swarm_portainer
          fi
      fi

      # Check network status
      if ! docker network ls | grep -q "lb_network"; then
          echo "lb_network is missing!"
          echo "Creating lb_network overlay network..."
          docker network create -d overlay lb_network
      fi

      if ! docker network ls | grep -q "agent_network"; then
          echo "agent_network is missing!"
          echo "Creating agent_network overlay network..."
          docker network create -d overlay agent_network
      fi

      echo "\nService check and restart complete!"
      echo "Current service status:"
      docker service ls
  - path: "/root/swarm.env"
    permissions: "0777"
    content: |
      MOCK_MODE=${mock_mode}
      NODE_ENV=production
      CATALOGUE_PORT=${catalogue_port}
      CATALOGUE_URL=http://localhost:${catalogue_port}
      OADB_USER=catalogue_user
      OADB_PW='${catalogue_password}'
      OADB_SERVICE=${db_name}_tp
      STATIC_MEDIA_URL=${assets_url}
      DEPLOY_ID=${deploy_id}
      REGION_ID=${region_id}
      OBJECT_NAMESPACE=${object_namespace}
      AWSSECRETACCESSKEY=${s3_secret}
      AWSACCESSKEYID=${s3_key_id}
      # Cloudflare and Pangolin variables
      YOUR_EMAIL=${cloudflare_email}
      YOUR_CF_API_TOKEN=${cloudflare_api_token}
      PANGOLIN_TOKEN=${pangolin_token}
      YOUR_DOMAIN=${domain_name}
      # Deployment options
      DEPLOY_DATABASE=${deploy_database}
      DEPLOY_WEB_APP=${deploy_web_app}

runcmd:
 - echo "Running prep scripts..."
 - /root/setup.preflight.sh
 - echo "Finished prep scripts."
 - echo "App is starting as swarm stack..."

final_message: "The system is finally up, after $UPTIME seconds"
output: {all: '| tee -a /root/cloud-init-output.log'}