version: "3.6"

services:
    whoami:
        image: traefik/whoami:v1.6.1
        deploy:
            mode: replicated
            replicas: 1
            labels:
                - traefik.enable=true
                - traefik.docker.network=lb_network
                - traefik.constraint-label=traefik-public
                - traefik.http.routers.whoami.rule=Path(`/whoami`)
                - traefik.http.services.whoami.loadbalancer.server.port=80
        networks:
            - lb_network

    registry:
        image: registry:2
        ports:
            - 5000:5000
        networks:
            - lb_network
        volumes:
            - registry:/var/lib/registry
        deploy:
            mode: replicated
            replicas: 1
            labels:
                - traefik.enable=true
                - traefik.docker.network=lb_network
                - traefik.constraint-label=traefik-public
                - traefik.http.routers.registry.rule=(Host(`registry.mydomain.com`) && PathPrefix(`/v2/`))
                - traefik.http.routers.registry.entrypoints=https
                - traefik.http.routers.registry.tls=true
                - traefik.http.routers.registry.tls.certresolver=le
                - traefik.http.services.registry.loadbalancer.server.port=5000

    agent:
        image: portainer/agent
        environment:
            # REQUIRED: Should be equal to the service name prefixed by "tasks." when
            # deployed inside an overlay network
            AGENT_CLUSTER_ADDR: tasks.swarm_agent
            # AGENT_PORT: 9001
            # LOG_LEVEL: debug
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /var/lib/docker/volumes:/var/lib/docker/volumes
        networks:
            - agent_network
        deploy:
            mode: global
            placement:
                constraints: [node.platform.os == linux]

    portainer:
        image: portainer/portainer-ce:2.11.1
        command: -H tcp://tasks.swarm_agent:9001 --tlsskipverify
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer:/data
        networks:
            - agent_network
            - lb_network
        deploy:
            mode: replicated
            replicas: 1
            labels:
                - traefik.enable=true
                - traefik.docker.network=lb_network
                - traefik.constraint-label=traefik-public
                - traefik.http.routers.portainer.rule=(Host(`dev-oci.mydomain.com`) && PathPrefix(`/`))
                - traefik.http.routers.portainer.entrypoints=https
                - traefik.http.routers.portainer.tls=true
                - traefik.http.routers.portainer.tls.certresolver=le
                - traefik.http.services.portainer.loadbalancer.server.port=9000

    traefik:
        image: traefik:v2.6.1
        ports:
            - target: 80
              published: 80
              protocol: tcp
              mode: host
            - target: 443
              published: 443
              protocol: tcp
              mode: host
        deploy:
            mode: global
            placement:
                constraints:
                    - node.role == manager
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /var/log/traefik:/var/log/traefik:rw
            - registry:/data
        command:
            - --providers.docker
            - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
            - --providers.docker.exposedbydefault=false
            - --providers.docker.swarmmode
            - --entrypoints.http.address=:80
            - --entrypoints.https.address=:443
            - --serversTransport.insecureSkipVerify=true
            - --certificatesresolvers.cloudflare.acme.email=${YOUR_EMAIL}
            - --certificatesresolvers.cloudflare.acme.storage=/data/acme.json
            - --certificatesresolvers.cloudflare.acme.dnschallenge=true
            - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
            - --entryPoints.http.forwardedHeaders.trustedIPs=127.0.0.1/32,10.0.0.0/8
        environment:
            - CLOUDFLARE_EMAIL=${YOUR_EMAIL}
            - CLOUDFLARE_DNS_API_TOKEN=${YOUR_CF_API_TOKEN}
        networks:
            - lb_network

    # Add Pangolin (or alternative like Cloudflare Tunnel)
    pangolin:
        image: ghcr.io/dperson/pangolin:latest
        restart: unless-stopped
        environment:
            - TOKEN=${PANGOLIN_TOKEN}
            - DOMAIN=${YOUR_DOMAIN}
        networks:
            - lb_network
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == worker

    # Example local service proxy
    localproxy:
        image: nginx:alpine
        networks:
            - lb_network
        deploy:
            labels:
                - traefik.enable=true
                - traefik.docker.network=lb_network
                - traefik.http.routers.localproxy.rule=Host(`local.${YOUR_DOMAIN}`)
                - traefik.http.routers.localproxy.entrypoints=https
                - traefik.http.routers.localproxy.tls=true
                - traefik.http.routers.localproxy.tls.certresolver=cloudflare
                - traefik.http.services.localproxy.loadbalancer.server.port=80
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  registry:
    driver: s3fs
    name: "oci-registry-$DEPLOY_ID"
  portainer:
    driver: s3fs
    name: "oci-portainer-$DEPLOY_ID"

networks:
  # Use the previously created public network "traefik-public", shared with other
  # services that need to be publicly available via this Traefik
  lb_network:
    external: true
  agent_network:
    external: true
