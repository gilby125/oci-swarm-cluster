version: "3.8"

services:
    traefik:
        image: traefik:v2.9
        restart: unless-stopped
        command:
            - "--providers.docker"
            - "--providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.docker.swarmmode"
            - "--providers.file.directory=/etc/traefik"
            - "--providers.file.watch=true"
            - "--entrypoints.http.address=:80"
            - "--entrypoints.https.address=:443"
            - "--serversTransport.insecureSkipVerify=true"
            ${cloudflare_config}
            - "--entryPoints.http.forwardedHeaders.trustedIPs=127.0.0.1/32,10.0.0.0/8"
            - "--entrypoints.http.http.redirections.entryPoint.to=https"
            - "--entrypoints.http.http.redirections.entryPoint.scheme=https"
            - "--entrypoints.http.http.redirections.entrypoint.permanent=true"
            - "--accesslog=true"
            - "--accesslog.filepath=/var/log/traefik/access.log"
            - "--log=true"
            - "--log.level=DEBUG"
            - "--log.filepath=/var/log/traefik/traefik.log"
            - "--api=true"
            - "--api.dashboard=true"
        ports:
            - target: 80
              published: 80
              mode: host
            - target: 443
              published: 443
              mode: host
        environment:
            ${cloudflare_env}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - traefik-data:/data
            - /var/log/traefik:/var/log/traefik
            - /root/traefik_dynamic_conf.toml:/etc/traefik/dynamic_conf.toml
        networks:
            - lb_network
            - traefik-public
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
            labels:
                - "traefik.enable=true"
                - "traefik.constraint-label=traefik-public"
                - "traefik.http.routers.traefik-public-https.rule=Host(`traefik.${domain_name}`)"
                - "traefik.http.routers.traefik-public-https.entrypoints=https"
                - "traefik.http.routers.traefik-public-https.tls=${tls_config}"
                - "traefik.http.routers.traefik-public-https.service=api@internal"
                - "traefik.http.services.traefik-public.loadbalancer.server.port=8080"

    agent:
        image: portainer/agent:latest
        restart: unless-stopped
        environment:
            - AGENT_CLUSTER_ADDR=tasks.agent
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /var/lib/docker/volumes:/var/lib/docker/volumes
        networks:
            - lb_network
        deploy:
            mode: global
            placement:
                constraints:
                    - node.platform.os == linux

    portainer:
        image: portainer/portainer-ce:latest
        restart: unless-stopped
        command: -H tcp://tasks.agent:9001 --tlsskipverify
        volumes:
            - portainer-data:/data
        networks:
            - lb_network
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
            labels:
                - "traefik.enable=true"
                - "traefik.constraint-label=traefik-public"
                - "traefik.http.routers.portainer.rule=Host(`portainer.${domain_name}`)"
                - "traefik.http.routers.portainer.entrypoints=https"
                - "traefik.http.routers.portainer.tls=${tls_config}"
                - "traefik.http.services.portainer-svc.loadbalancer.server.port=9000"

    registry:
        image: registry:2
        restart: unless-stopped
        volumes:
            - registry-data:/var/lib/registry
        networks:
            - lb_network
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
            labels:
                - "traefik.enable=true"
                - "traefik.constraint-label=traefik-public"
                - "traefik.http.routers.registry.rule=Host(`registry.${domain_name}`)"
                - "traefik.http.routers.registry.entrypoints=https"
                - "traefik.http.routers.registry.tls=${tls_config}"
                - "traefik.http.services.registry-svc.loadbalancer.server.port=5000"

    whoami:
        image: traefik/whoami
        restart: unless-stopped
        networks:
            - lb_network
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
            labels:
                - "traefik.enable=true"
                - "traefik.constraint-label=traefik-public"
                - "traefik.http.routers.whoami.rule=Host(`whoami.${domain_name}`) || Path(`/whoami`)"
                - "traefik.http.routers.whoami.entrypoints=https"
                - "traefik.http.routers.whoami.tls=${tls_config}"
                - "traefik.http.services.whoami-svc.loadbalancer.server.port=80"

    pangolin:
        image: fosrl/pangolin:latest
        restart: unless-stopped
        ports:
            - "3001:3001"
        environment:
            - PANGOLIN_DOMAIN=admin-pangolin.${domain_name}
            - PANGOLIN_ADMIN_EMAIL=admin@${domain_name}
            - PANGOLIN_ADMIN_PASSWORD=${pangolin_admin_password}
            - PANGOLIN_JWT_SECRET=${pangolin_token}
            - PANGOLIN_DB_TYPE=sqlite
            - PANGOLIN_DB_PATH=/app/config/pangolin.db
            - PANGOLIN_CONFIG_FILE=/app/config/config.json
        volumes:
            - pangolin_config:/app/config
            - /root/pangolin-config.json:/app/config/config.json:ro
        networks:
            - lb_network
            - traefik-public
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
            interval: "10s"
            timeout: "5s"
            retries: 3
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
            labels:
                - "traefik.enable=true"
                - "traefik.docker.network=traefik-public"
                - "traefik.constraint-label=traefik-public"
                - "traefik.http.routers.pangolin.rule=Host(`admin-pangolin.${domain_name}`)"
                - "traefik.http.routers.pangolin.entrypoints=https"
                - "traefik.http.routers.pangolin.tls=${tls_config}"
                - "traefik.http.services.pangolin.loadbalancer.server.port=3001"
                # Add HTTP router for pangolin to handle redirects
                - "traefik.http.routers.pangolin-http.rule=Host(`admin-pangolin.${domain_name}`)"
                - "traefik.http.routers.pangolin-http.entrypoints=http"
                - "traefik.http.middlewares.pangolin-https-redirect.redirectscheme.scheme=https"
                - "traefik.http.routers.pangolin-http.middlewares=pangolin-https-redirect"

    # Example local service proxy
    localproxy:
        image: nginx:alpine
        restart: unless-stopped
        volumes:
            - /root/nginx.conf:/etc/nginx/nginx.conf
        networks:
            - lb_network
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
            labels:
                - "traefik.enable=true"
                - "traefik.constraint-label=traefik-public"
                - "traefik.http.routers.localproxy.rule=Host(`local.${domain_name}`)"
                - "traefik.http.routers.localproxy.entrypoints=https"
                - "traefik.http.routers.localproxy.tls=${tls_config}"
                - "traefik.http.services.localproxy-svc.loadbalancer.server.port=80"

networks:
    lb_network:
        driver: overlay
        attachable: true
    traefik-public:
        driver: overlay
        attachable: true

volumes:
    traefik-data:
        driver: local
    portainer-data:
        driver: local
    registry-data:
        driver: local
    pangolin_config:
        driver: local
