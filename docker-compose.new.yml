version: "3.8"

services:
    traefik:
        image: traefik:v2.9
        restart: unless-stopped
        command:
            - "--providers.docker"
            - "--providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.docker.swarmmode"
            - "--providers.file.directory=/etc/traefik"
            - "--providers.file.watch=true"
            - "--entrypoints.http.address=:80"
            - "--entrypoints.https.address=:443"
            - "--serversTransport.insecureSkipVerify=true"
            - "--entryPoints.http.forwardedHeaders.trustedIPs=127.0.0.1/32,10.0.0.0/8"
            - "--accesslog=true"
            - "--accesslog.filepath=/var/log/traefik/access.log"
            - "--log=true"
            - "--log.level=DEBUG"
            - "--log.filepath=/var/log/traefik/traefik.log"
            - "--api=true"
            - "--api.dashboard=true"
        ports:
            - target: 80
              published: 80
              mode: host
            - target: 443
              published: 443
              mode: host
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - traefik-data:/data
            - /var/log/traefik:/var/log/traefik
            - /root/traefik_dynamic_conf.toml:/etc/traefik/dynamic_conf.toml
        networks:
            - lb_network
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
            labels:
                - "traefik.enable=true"
                - "traefik.constraint-label=traefik-public"
                - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.throughfire.net`) || Host(`traefik.local`) || Host(`64.181.208.149`)"
                - "traefik.http.routers.traefik-dashboard.service=api@internal"
                - "traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080"

    agent:
        image: portainer/agent:latest
        restart: unless-stopped
        environment:
            - AGENT_CLUSTER_ADDR=tasks.agent
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /var/lib/docker/volumes:/var/lib/docker/volumes
        networks:
            - lb_network
        deploy:
            mode: global
            placement:
                constraints:
                    - node.platform.os == linux

    portainer:
        image: portainer/portainer-ce:latest
        restart: unless-stopped
        command: -H tcp://tasks.agent:9001 --tlsskipverify
        volumes:
            - portainer-data:/data
        networks:
            - lb_network
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
            labels:
                - "traefik.enable=true"
                - "traefik.constraint-label=traefik-public"
                - "traefik.http.routers.portainer.rule=Host(`portainer.throughfire.net`) || Host(`portainer.local`) || (Host(`64.181.208.149`) && PathPrefix(`/portainer`))"
                - "traefik.http.routers.portainer.middlewares=portainer-stripprefix"
                - "traefik.http.middlewares.portainer-stripprefix.stripprefix.prefixes=/portainer"
                - "traefik.http.services.portainer.loadbalancer.server.port=9000"

    registry:
        image: registry:2
        restart: unless-stopped
        volumes:
            - registry-data:/var/lib/registry
        networks:
            - lb_network
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
            labels:
                - "traefik.enable=true"
                - "traefik.constraint-label=traefik-public"
                - "traefik.http.routers.registry.rule=Host(`registry.throughfire.net`) || Host(`registry.local`) || (Host(`64.181.208.149`) && PathPrefix(`/registry`))"
                - "traefik.http.routers.registry.middlewares=registry-stripprefix"
                - "traefik.http.middlewares.registry-stripprefix.stripprefix.prefixes=/registry"
                - "traefik.http.services.registry.loadbalancer.server.port=5000"

    whoami:
        image: traefik/whoami
        restart: unless-stopped
        networks:
            - lb_network
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
            labels:
                - "traefik.enable=true"
                - "traefik.constraint-label=traefik-public"
                - "traefik.http.routers.whoami.rule=Host(`whoami.throughfire.net`) || Host(`whoami.local`) || (Host(`64.181.208.149`) && PathPrefix(`/whoami`))"
                - "traefik.http.routers.whoami.middlewares=whoami-stripprefix"
                - "traefik.http.middlewares.whoami-stripprefix.stripprefix.prefixes=/whoami"
                - "traefik.http.services.whoami.loadbalancer.server.port=80"

    pangolin:
        image: nginx:alpine
        restart: unless-stopped
        environment:
            - TOKEN=B9D4VcWM62u88Uch7ZoXurupWU560ft7
            - DOMAIN=throughfire.net
        networks:
            - lb_network
        deploy:
            labels:
                - "traefik.enable=true"
                - "traefik.constraint-label=traefik-public"
                - "traefik.http.routers.pangolin.rule=Host(`admin-pangolin.throughfire.net`) || Host(`admin-pangolin.local`) || (Host(`64.181.208.149`) && PathPrefix(`/pangolin`))"
                - "traefik.http.routers.pangolin.middlewares=pangolin-stripprefix"
                - "traefik.http.middlewares.pangolin-stripprefix.stripprefix.prefixes=/pangolin"
                - "traefik.http.services.pangolin.loadbalancer.server.port=80"
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
        command: >
            /bin/sh -c "echo 'Pangolin service running in compatibility mode' > /usr/share/nginx/html/index.html &&
            echo 'Domain: throughfire.net' >> /usr/share/nginx/html/index.html &&
            echo 'Token: [REDACTED]' >> /usr/share/nginx/html/index.html &&
            nginx -g 'daemon off;'"

    # Example local service proxy
    localproxy:
        image: nginx:alpine
        restart: unless-stopped
        volumes:
            - /root/nginx.conf:/etc/nginx/nginx.conf
        networks:
            - lb_network
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints:
                    - node.role == manager
            labels:
                - "traefik.enable=true"
                - "traefik.constraint-label=traefik-public"
                - "traefik.http.routers.localproxy.rule=Host(`local.throughfire.net`) || Host(`local.local`) || (Host(`64.181.208.149`) && PathPrefix(`/local`))"
                - "traefik.http.routers.localproxy.middlewares=localproxy-stripprefix"
                - "traefik.http.middlewares.localproxy-stripprefix.stripprefix.prefixes=/local"
                - "traefik.http.services.localproxy.loadbalancer.server.port=80"

networks:
    lb_network:
        driver: overlay
        attachable: true

volumes:
    traefik-data:
        driver: local
    portainer-data:
        driver: local
    registry-data:
        driver: local
