<!DOCTYPE html>
<html>
<head>
    <title>Browser Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        h1 {
            color: #333;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Browser Test</h1>
        <p>This page tests your browser's security settings and CORS functionality.</p>
        
        <div>
            <h2>Test 1: Basic JavaScript</h2>
            <button onclick="testBasicJavaScript()">Run Test</button>
            <div id="basic-js-result" class="result"></div>
        </div>
        
        <div>
            <h2>Test 2: Cookies</h2>
            <button onclick="testCookies()">Run Test</button>
            <div id="cookies-result" class="result"></div>
        </div>
        
        <div>
            <h2>Test 3: CORS Request</h2>
            <button onclick="testCORS()">Run Test</button>
            <div id="cors-result" class="result"></div>
        </div>
        
        <div>
            <h2>Test 4: Content Security Policy</h2>
            <button onclick="testCSP()">Run Test</button>
            <div id="csp-result" class="result"></div>
        </div>
        
        <div>
            <h2>Browser Information</h2>
            <div id="browser-info" class="result"></div>
        </div>
    </div>

    <script>
        // Display browser information
        document.getElementById('browser-info').innerHTML = `
            <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
            <p><strong>Browser:</strong> ${navigator.appName}</p>
            <p><strong>Version:</strong> ${navigator.appVersion}</p>
            <p><strong>Cookies Enabled:</strong> ${navigator.cookieEnabled}</p>
        `;
        
        // Test 1: Basic JavaScript
        function testBasicJavaScript() {
            try {
                const result = 2 + 2;
                document.getElementById('basic-js-result').innerHTML = `
                    <p class="success">JavaScript is working correctly! 2 + 2 = ${result}</p>
                `;
            } catch (error) {
                document.getElementById('basic-js-result').innerHTML = `
                    <p class="error">JavaScript error: ${error.message}</p>
                `;
            }
        }
        
        // Test 2: Cookies
        function testCookies() {
            try {
                // Set a test cookie
                document.cookie = "testCookie=Hello World; path=/";
                
                // Check if the cookie was set
                if (document.cookie.indexOf("testCookie=") !== -1) {
                    document.getElementById('cookies-result').innerHTML = `
                        <p class="success">Cookies are working correctly!</p>
                        <p>Current cookies: ${document.cookie}</p>
                    `;
                } else {
                    document.getElementById('cookies-result').innerHTML = `
                        <p class="error">Cookies are not working. The test cookie could not be set.</p>
                    `;
                }
            } catch (error) {
                document.getElementById('cookies-result').innerHTML = `
                    <p class="error">Cookie error: ${error.message}</p>
                `;
            }
        }
        
        // Test 3: CORS Request
        function testCORS() {
            const resultElement = document.getElementById('cors-result');
            resultElement.innerHTML = `<p>Testing CORS request to example.com...</p>`;
            
            fetch('https://jsonplaceholder.typicode.com/todos/1')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    resultElement.innerHTML = `
                        <p class="success">CORS request successful!</p>
                        <p>Response: ${JSON.stringify(data)}</p>
                    `;
                })
                .catch(error => {
                    resultElement.innerHTML = `
                        <p class="error">CORS request failed: ${error.message}</p>
                    `;
                });
        }
        
        // Test 4: Content Security Policy
        function testCSP() {
            try {
                // Try to create and execute an inline script
                const script = document.createElement('script');
                script.textContent = 'document.getElementById("csp-result").innerHTML = "<p class=\\"success\\">Inline script executed successfully!</p>";';
                document.body.appendChild(script);
                
                // If we get here, the inline script was allowed
                setTimeout(() => {
                    if (!document.getElementById('csp-result').innerHTML.includes('success')) {
                        document.getElementById('csp-result').innerHTML = `
                            <p class="error">Inline script was blocked by Content Security Policy.</p>
                        `;
                    }
                }, 500);
            } catch (error) {
                document.getElementById('csp-result').innerHTML = `
                    <p class="error">CSP error: ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
